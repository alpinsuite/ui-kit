include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Keep the build honest: anything the analyzer flags fails CI.
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
    # A library is consumed through its exports, so the shape of the public
    # surface matters more here than it does inside an application.
    - directives_ordering
